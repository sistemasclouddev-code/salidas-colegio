<!--Grupo 1A-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salón 1A - Salidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --pastel-bg: #f8fafc;
            --pastel-card: #ffffff;
            --pastel-accent: #38bdf8;
            --pastel-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            --text-main: #0f172a;
        }
        body {
            background-color: var(--pastel-bg);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }
        .main-card {
            background: var(--pastel-card);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .hero-salida {
            background: var(--pastel-gradient);
            border-radius: 1.25rem;
            border-left: 8px solid var(--pastel-accent);
            box-shadow: inset 0 2px 4px 0 rgba(255, 255, 255, 0.6);
        }
        .nombre-alumno {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 900;
            color: #0369a1;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animar-cambio {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .table > :not(caption) > * > * {
            padding: 1rem 1.25rem;
            background-color: transparent;
        }
        .table tbody tr {
            transition: background-color 0.2s ease;
        }
        .table tbody tr:hover {
            background-color: #f0f9ff;
        }
        #audioActivador {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1050;
            border-radius: 50rem;
            padding: 0.85rem 1.75rem;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
            border: none;
            background: #f59e0b;
            color: #fff;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        #audioActivador:hover {
            transform: scale(1.05);
            background: #d97706;
        }
    </style>
</head>
<body class="py-5">

    <div class="container py-2">
        <div class="text-center mb-5">
            <span class="badge bg-sky-subtle text-sky border border-sky-subtle px-3 py-1 rounded-pill mb-2 fw-semibold" style="background-color: #e0f2fe; color: #0284c7;">Control Escolar</span>
            <h1 class="display-4 fw-bold tracking-tight text-dark mb-1">🏫 Salón 1A</h1>
            <p class="text-muted fs-5">Monitoreo en tiempo real de salida de alumnos</p>
        </div>
        
        <div class="main-card hero-salida p-4 p-md-5 mb-5 text-center">
            <span class="badge bg-white text-info border border-info-subtle shadow-sm mb-3 px-3 py-2 rounded-pill fs-6 fw-bold">Último Alumno Registrado</span>
            <div id="ultimo" class="my-2">
                <div class="nombre-alumno">Esperando salida...</div>
                <small class="text-muted fs-3 fw-medium"></small>
            </div>
        </div>
        
        <div class="main-card p-4">
            <h2 class="h4 text-secondary mb-4 pb-3 border-bottom fw-semibold">📋 Últimas 10 salidas</h2>
            <div class="table-responsive">
                <table class="table align-middle fs-5 mb-0">
                    <thead class="table-light text-uppercase fs-6 text-muted tracking-wider">
                        <tr>
                            <th style="width: 30%;" class="rounded-start-3">Hora</th>
                            <th style="width: 70%;" class="rounded-end-3">Nombre del Alumno</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-lista">
                        <tr><td colspan="2" class="text-center text-muted py-5 fst-italic">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <audio id="alerta" preload="auto">
        <source src="https://www.dropbox.com/scl/fi/mzz2pt3zizov481qjc3q2/alerta2.mp3?rlkey=0rl30unk88cfk22s2e1s2cwoj&st=cc6mv3xy&raw=1" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <button id="audioActivador">🔈 Habilitar alertas sonoras</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const grupo = "1A";
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyxFu756QssmDL5wptbqTL_4hEscNNjCPYPZWLXiBzsJtJT7ykhW900euJ8eQoH_Km0KQ/exec";

        let audioHabilitado = false;
        const alertaSound = document.getElementById('alerta');
        let ultimoNombreMostrado = "";

        function reproducirAlerta() {
            if (!audioHabilitado) return;
            alertaSound.currentTime = 0;
            alertaSound.play().catch(e => console.log('Error al reproducir:', e));
        }

        document.getElementById('audioActivador').addEventListener('click', function() {
            alertaSound.play().then(() => {
                audioHabilitado = true;
                this.style.display = 'none';
                console.log('Audio habilitado');
            }).catch(e => {
                alert('Haz clic en la página para habilitar el sonido');
            });
        });

        function actualizar() {
            if (window.scriptTag) {
                document.head.removeChild(window.scriptTag);
            }
            window.scriptTag = document.createElement('script');
            window.scriptTag.src = webAppUrl + "?grupo=" + encodeURIComponent(grupo) + "&callback=procesarDatos";
            document.head.appendChild(window.scriptTag);
        }

        window.procesarDatos = function(data) {
            if (data.error) {
                document.getElementById('ultimo').innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
                return;
            }

            const ultimoDiv = document.getElementById('ultimo');
            if (data.ultimo) {
                const ultimo = data.ultimo;
                
                if (ultimo.nombre !== ultimoNombreMostrado) {
                    ultimoDiv.innerHTML = `
                        <div class="nombre-alumno animar-cambio">${ultimo.nombre}</div>
                        <small class="text-muted fs-3 mt-2 d-block fw-medium animar-cambio">${ultimo.grupoCompleto}</small>
                    `;
                    reproducirAlerta();
                    ultimoNombreMostrado = ultimo.nombre;
                }
            } else {
                ultimoDiv.innerHTML = '<div class="nombre-alumno fs-3 text-muted">Sin registros aún</div><small class="text-muted"></small>';
            }

            const tbody = document.getElementById('tabla-lista');
            tbody.innerHTML = '';

            if (data.lista && data.lista.length > 0) {
                data.lista.forEach(reg => {
                    const fecha = new Date(reg.timestamp);
                    const hora = fecha.toLocaleTimeString();
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td class="text-secondary fw-medium">${hora}</td>
                        <td class="fw-semibold text-dark">${reg.nombre}</td>
                    `;
                    tbody.appendChild(fila);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center py-4 text-muted">No hay salidas registradas</td></tr>';
            }
        };

        setInterval(actualizar, 2000);
        actualizar();
    </script>
</body>
</html>
